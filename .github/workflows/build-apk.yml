name: Build Android APK

# Run this by hand: GitHub repo -> Actions -> "Build Android APK" -> Run workflow.
# Every run signs with the SAME key and a higher versionCode, so the new APK
# installs over the old one and keeps your data.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  APP_ID: com.jtec.jexa
  APP_NAME: JEXA
  KEY_ALIAS: jexa

jobs:
  apk:
    name: Build, sign and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASSWORD. Add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install

      - name: Build web app for Android
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_BASE_PATH: '/'
        run: bun run build

      - name: Create Capacitor config and Android project
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android

      - name: Generate launcher icons (optional)
        run: |
          mkdir -p assets
          SRC=public/pwa-maskable-512x512.png
          [ -f "$SRC" ] || SRC=public/pwa-512x512.png
          if [ -f "$SRC" ]; then
            if command -v magick >/dev/null 2>&1; then
              magick "$SRC" -resize 1024x1024 assets/icon-only.png
            else
              convert "$SRC" -resize 1024x1024 assets/icon-only.png
            fi
            cp assets/icon-only.png assets/icon-foreground.png
            npx --yes @capacitor/assets generate --android \
              --iconBackgroundColor '#0a0d14' --iconBackgroundColorDark '#0a0d14' \
              || echo "::warning::Icon generation skipped (default icon will be used)"
          else
            echo "::warning::No PWA icon found in public/. Default icon will be used."
          fi

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Set version (higher on every run so updates install over the old app)
        run: |
          VC=${{ github.run_number }}
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${VC}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${VC}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode ${VC}" android/app/build.gradle || { echo "::error::Could not set versionCode in android/app/build.gradle"; exit 1; }

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align and sign APK with the permanent key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out out/JEXA.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs out/JEXA.apk
          rm -f "$RUNNER_TEMP/release.p12"
          ls -la out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JEXA 1.0.${{ github.run_number }}
          body: |
            JEXA Android APK, build ${{ github.run_number }}.
            Download JEXA.apk below and open it to install. It installs over the previous version and keeps your data.
          files: out/JEXA.apk
          make_latest: true

      - name: Summary
        run: |
          echo "### APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the repo's **Releases** page and download **JEXA.apk** (build ${{ github.run_number }})." >> "$GITHUB_STEP_SUMMARY"
