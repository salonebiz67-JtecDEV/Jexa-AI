name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies cleanly
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build frontend for production
        env:
          # Central Render backend API URL (configure in GitHub repo Settings -> Variables -> Actions)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          # Optional custom base path override (defaults to dynamic /<repo-name>/ from GITHUB_REPOSITORY)
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '' }}
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::warning::VITE_API_BASE_URL is not set in GitHub repository variables. Add VITE_API_BASE_URL in Settings -> Secrets and variables -> Actions -> Variables with your Render URL (e.g. https://your-service.onrender.com)."
          fi
          npm run build

      - name: Verify build artifacts
        run: |
          echo "========================================="
          echo " Verifying Production Build Output"
          echo "========================================="

          if [ ! -d "dist" ]; then
            echo "::error::Build verification failed: 'dist' directory does not exist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed: 'dist/index.html' is missing."
            exit 1
          fi

          if [ ! -s "dist/index.html" ]; then
            echo "::error::Build verification failed: 'dist/index.html' is empty."
            exit 1
          fi

          if [ ! -d "dist/assets" ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::Build verification failed: 'dist/assets' is missing or contains no files."
            exit 1
          fi

          # Ensure 404.html fallback exists for GitHub Pages SPA client routing
          if [ ! -f "dist/404.html" ]; then
            echo "Generating dist/404.html SPA fallback from index.html..."
            cp dist/index.html dist/404.html
          fi

          echo "✓ dist/index.html verified ($(wc -c < dist/index.html) bytes)"
          echo "✓ dist/404.html verified"
          echo "✓ dist/assets verified ($(ls dist/assets | wc -l) files generated)"
          echo "Build validation passed successfully!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
