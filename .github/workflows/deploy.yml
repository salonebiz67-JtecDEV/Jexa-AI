name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Validate Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: bun run lint

      - name: Build frontend for production
        env:
          # Central Render backend API URL (configure in GitHub repo Settings -> Variables -> Actions)
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          # Optional custom base path override (defaults to dynamic /<repo-name>/ from GITHUB_REPOSITORY)
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '' }}
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::warning::VITE_API_BASE_URL is not set in GitHub repository variables. Add VITE_API_BASE_URL in Settings -> Secrets and variables -> Actions -> Variables with your Render URL (e.g. https://your-service.onrender.com)."
          fi
          bun run build

      - name: Verify build artifacts & PWA compliance
        run: |
          echo "========================================="
          echo " Verifying Production Build Output & PWA"
          echo "========================================="

          if [ ! -d "dist" ]; then
            echo "::error::Build verification failed: 'dist' directory does not exist."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build verification failed: 'dist/index.html' is missing."
            exit 1
          fi

          if [ ! -s "dist/index.html" ]; then
            echo "::error::Build verification failed: 'dist/index.html' is empty."
            exit 1
          fi

          if [ ! -d "dist/assets" ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::Build verification failed: 'dist/assets' is missing or contains no files."
            exit 1
          fi

          # 1. PWA Web App Manifest Verification
          if [ ! -f "dist/manifest.webmanifest" ] && [ ! -f "dist/manifest.json" ]; then
            echo "::error::PWA verification failed: Web App Manifest is missing from dist."
            exit 1
          fi

          # 2. Service Worker Verification
          if [ ! -f "dist/sw.js" ]; then
            echo "::error::PWA verification failed: Service Worker (dist/sw.js) is missing."
            exit 1
          fi

          # 3. PWA Icons Verification
          for icon in pwa-192x192.png pwa-512x512.png pwa-maskable-512x512.png apple-touch-icon.png; do
            if [ ! -f "dist/$icon" ]; then
              echo "::error::PWA verification failed: Required icon dist/$icon is missing."
              exit 1
            fi
          done

          # 4. Ensure 404.html fallback exists for GitHub Pages SPA client routing
          if [ ! -f "dist/404.html" ]; then
            echo "Generating dist/404.html SPA fallback from index.html..."
            cp dist/index.html dist/404.html
          fi

          # 5. Sanity check: Ensure no localhost URLs remain in production HTML
          if grep -q "http://localhost:" dist/index.html; then
            echo "::error::Production HTML contains hardcoded localhost URLs."
            exit 1
          fi

          echo "✓ dist/index.html verified ($(wc -c < dist/index.html) bytes)"
          echo "✓ dist/404.html verified"
          echo "✓ dist/manifest.webmanifest verified"
          echo "✓ dist/sw.js verified ($(wc -c < dist/sw.js) bytes)"
          echo "✓ PWA icons verified (192, 512, maskable, apple-touch)"
          echo "✓ dist/assets verified ($(ls dist/assets | wc -l) files generated)"
          echo "All production build & PWA verifications passed successfully!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
