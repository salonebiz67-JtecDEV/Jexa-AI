services:
  - type: web
    name: jexa-ai-companion
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEXT_AI_PROVIDER
        value: gemini
      - key: TEXT_AI_MODEL
        value: gemini-3.8-flash
      - key: TEXT_AI_BACKUP_MODEL
        value: gemini-3.7-flash
      - key: BACKGROUND_AI_MODEL
        value: gemini-3.5-flash-lite
      - key: VOICE_AI_PROVIDER
        value: gemini
      - key: VOICE_AI_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
