<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>JEXA - AI Companion</title>
    <script type="text/javascript">
      // Single Page Application redirect script for GitHub Pages
      // Encodes path and query into index.html so client-side history state restores smoothly
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var isSubpath = l.pathname.split('/').length > 2 && l.pathname.split('/')[1] !== '';
      var segments = isSubpath ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segments).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segments).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #07090e; color: #94a3b8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to JEXA...</p>
  </body>
</html>
